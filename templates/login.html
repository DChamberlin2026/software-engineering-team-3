
<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content = "IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SEBS - Login </title>

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #4a90d9;
        }

        .wrapper {
            width: 420px;
            background: lightgray;
            padding: 40px;
            border-radius: 12px;
            font-family: 'Copperplate', 'Copperplate Gothic Light', fantasy;
        }

        .wrapper h1 {
            font-size: 36px;
            text-align: center;
        }

        .wrapper .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }

        .input-box input {
            width: 100%;
            height: 50px;
            background: transparent;
            border: 2px solid black;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: black;
            padding: 0px 45px 0px 20px;

        }

        .input-box input::placeholder {
            color: black;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .button {
            width: 100%;
            height: 45px;
            background: #4a90d9;
            color: black;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
    
    </style>

</head>


<body>

    <div class="wrapper">

        <form action="">
            <h1>SEBS LOGIN PAGE</h1>
            <!-- typing box with username and password-->
            <div class="input-box">
                <input type="text" placeholder="Username" 
                required >
                <i class="bx bx-user-square"> </i>
            
            </div>

            <div class="input-box">
            
                <input type="password" placeholder="Password" 
                required >
                <i class="bx bx-lock" > </i>
            </div>

            <!-- the button to submit login info -->
            <button type="submit" class="button" >Login </button>
        </form>
    </div>

</body>

</html>
